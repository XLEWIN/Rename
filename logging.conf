
[loggers]
keys=root,pyrogram,aiohttp,motor,pymongo

[handlers]
keys=consoleHandler,fileHandler,errorFileHandler

[formatters]
keys=standardFormatter,detailedFormatter

# ══════════════════════════════════════════════════════════════
#  𝗟𝗢𝗚𝗚𝗘𝗥𝗦
# ══════════════════════════════════════════════════════════════

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,errorFileHandler

[logger_pyrogram]
level=WARNING
handlers=consoleHandler,fileHandler,errorFileHandler
qualname=pyrogram
propagate=0

[logger_aiohttp]
level=WARNING
handlers=consoleHandler,fileHandler,errorFileHandler
qualname=aiohttp
propagate=0

[logger_motor]
level=WARNING
handlers=consoleHandler,fileHandler,errorFileHandler
qualname=motor
propagate=0

[logger_pymongo]
level=WARNING
handlers=consoleHandler,fileHandler,errorFileHandler
qualname=pymongo
propagate=0

# ══════════════════════════════════════════════════════════════
#  𝗛𝗔𝗡𝗗𝗟𝗘𝗥𝗦
# ══════════════════════════════════════════════════════════════

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=standardFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=detailedFormatter
# 20MB per file, keeping 10 backups
args=('logs/bot.log', 'a', 20971520, 10, 'utf-8')

[handler_errorFileHandler]
class=logging.handlers.RotatingFileHandler
level=ERROR
formatter=detailedFormatter
# 10MB per file, keeping 5 backups
args=('logs/error.log', 'a', 10485760, 5, 'utf-8')

# ══════════════════════════════════════════════════════════════
#  𝗙𝗢𝗥𝗠𝗔𝗧𝗧𝗘𝗥𝗦
# ══════════════════════════════════════════════════════════════

[formatter_standardFormatter]
format=◈ %(asctime)s | %(levelname)-8s | %(name)-15s | %(message)s
datefmt=%H:%M:%S

[formatter_detailedFormatter]
format=[%(asctime)s] %(levelname)-8s | %(name)-25s | %(funcName)-20s:%(lineno)d | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
